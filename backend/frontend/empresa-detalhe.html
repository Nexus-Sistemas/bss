<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Detalhe da Empresa — BSS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="w-56 flex-shrink-0"></aside>

    <div class="flex-1 flex flex-col">
      <header class="bg-white border-b border-slate-200">
        <div class="px-6 py-4 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <a href="/app/empresas.html" class="text-slate-400 hover:text-slate-700 text-xl">←</a>
            <h1 id="titulo" class="text-xl font-semibold text-slate-800">Detalhe da Empresa</h1>
          </div>
          <div class="flex items-center gap-3 text-sm">
            <button id="btn-editar-empresa" onclick="abrirEdicaoEmpresa()"
                    class="hidden px-3 py-1.5 border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-lg font-medium">
              Editar
            </button>
            <span id="usuario-info" class="text-slate-500">—</span>
            <button onclick="logout()" class="text-slate-500 hover:text-slate-800">Sair</button>
          </div>
        </div>
      </header>

      <main class="flex-1 px-6 py-6 max-w-7xl">
        <div id="loading" class="text-slate-500 text-center py-12">Carregando…</div>

        <!-- Modal de edição da empresa -->
        <div id="modal-emp" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
          <div class="bg-white rounded-xl shadow-xl max-w-2xl w-full max-h-[90vh] flex flex-col">
            <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between gap-3">
              <h3 class="font-semibold text-slate-800">Editar empresa</h3>
              <button onclick="fecharEdicaoEmpresa()" class="text-slate-400 hover:text-slate-700 text-xl leading-none">&times;</button>
            </div>
            <div class="px-5 py-4 overflow-y-auto flex-1 grid grid-cols-1 md:grid-cols-12 gap-3 text-sm">
              <div class="md:col-span-8"><label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Razão social *</label>
                <input id="ee-razao" class="w-full border border-slate-300 rounded-lg px-3 py-2"></div>
              <div class="md:col-span-4"><label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Status</label>
                <select id="ee-status" class="w-full border border-slate-300 rounded-lg px-2 py-2 bg-white">
                  <option value="ativa">ativa</option><option value="suspensa">suspensa</option>
                  <option value="cancelada">cancelada</option><option value="inativa">inativa</option>
                </select></div>
              <div class="md:col-span-8"><label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Nome fantasia</label>
                <input id="ee-fantasia" class="w-full border border-slate-300 rounded-lg px-3 py-2"></div>
              <div class="md:col-span-4"><label class="block text-xs font-semibold text-slate-500 uppercase mb-1">CNPJ</label>
                <input id="ee-cnpj" class="w-full border border-slate-300 rounded-lg px-3 py-2"></div>
              <div class="md:col-span-8"><label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Logradouro</label>
                <input id="ee-logradouro" class="w-full border border-slate-300 rounded-lg px-3 py-2"></div>
              <div class="md:col-span-4"><label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Número</label>
                <input id="ee-numero" class="w-full border border-slate-300 rounded-lg px-3 py-2"></div>
              <div class="md:col-span-6"><label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Complemento</label>
                <input id="ee-complemento" class="w-full border border-slate-300 rounded-lg px-3 py-2"></div>
              <div class="md:col-span-6"><label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Bairro</label>
                <input id="ee-bairro" class="w-full border border-slate-300 rounded-lg px-3 py-2"></div>
              <div class="md:col-span-6"><label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Cidade</label>
                <input id="ee-cidade" class="w-full border border-slate-300 rounded-lg px-3 py-2"></div>
              <div class="md:col-span-2"><label class="block text-xs font-semibold text-slate-500 uppercase mb-1">UF</label>
                <input id="ee-uf" maxlength="2" class="w-full border border-slate-300 rounded-lg px-3 py-2 uppercase"></div>
              <div class="md:col-span-4"><label class="block text-xs font-semibold text-slate-500 uppercase mb-1">CEP</label>
                <input id="ee-cep" class="w-full border border-slate-300 rounded-lg px-3 py-2"></div>
              <div class="md:col-span-6"><label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Telefone</label>
                <input id="ee-telefone" class="w-full border border-slate-300 rounded-lg px-3 py-2"></div>
              <p class="md:col-span-12 text-xs text-slate-400">Campos enviados pela sync podem ser sobrescritos no próximo ciclo.</p>
            </div>
            <div class="px-5 py-4 border-t border-slate-100 flex items-center gap-3">
              <button onclick="salvarEdicaoEmpresa()" id="btn-salvar-emp" class="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium">Salvar</button>
              <button onclick="fecharEdicaoEmpresa()" class="px-4 py-2 text-sm border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50">Cancelar</button>
              <span id="ee-msg" class="text-xs"></span>
            </div>
          </div>
        </div>

        <div id="conteudo" class="hidden space-y-4">
          <!-- Cabeçalho da empresa -->
          <section class="bg-white rounded-lg border border-slate-200 p-5">
            <div id="grid-basica" class="grid grid-cols-1 md:grid-cols-12 gap-y-3 gap-x-6 text-sm"></div>
          </section>

          <!-- Relacionamentos (abas inferiores) -->
          <section class="bg-white rounded-lg border border-slate-200">
            <div class="border-b border-slate-200 flex items-center gap-1 px-3 overflow-x-auto">
              <button id="rtab-trabalhadores" onclick="trocarRel('trabalhadores')"
                      class="px-4 py-2.5 text-sm font-medium text-slate-800 border-b-2 border-indigo-600 whitespace-nowrap">
                Trabalhadores / Dependentes <span id="rcount-trabalhadores" class="ml-1 px-1.5 py-0.5 rounded-full text-[10px] bg-slate-100 text-slate-600">·</span>
              </button>
              <button id="rtab-boletos" onclick="trocarRel('boletos')"
                      class="px-4 py-2.5 text-sm text-slate-500 hover:text-slate-800 whitespace-nowrap">Boletos</button>
              <button id="rtab-usuarios" onclick="trocarRel('usuarios')"
                      class="px-4 py-2.5 text-sm text-slate-500 hover:text-slate-800 whitespace-nowrap">Usuários com acesso</button>
              <button id="rtab-historico" onclick="trocarRel('historico')"
                      class="px-4 py-2.5 text-sm text-slate-500 hover:text-slate-800 whitespace-nowrap">Histórico</button>
            </div>
            <div id="rel-trabalhadores" class="min-h-[120px]"></div>
            <div id="rel-boletos" class="hidden min-h-[120px]"></div>
            <div id="rel-usuarios" class="hidden min-h-[120px]"></div>
            <div id="rel-historico" class="hidden min-h-[120px]"></div>
          </section>
        </div>

        <div id="erro" class="hidden text-rose-600 text-center py-8"></div>
      </main>
    </div>
  </div>

  <script src="/app/js/api.js"></script>
  <script src="/app/js/sidebar.js"></script>
  <script>renderizarSidebar("empresas");</script>
  <script src="/app/js/empresa-detalhe.js"></script>
</body>
</html>
