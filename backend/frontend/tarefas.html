<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Checklist — BSS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">
  <div class="flex h-screen overflow-hidden">
    <aside id="sidebar" class="w-60 flex-shrink-0"></aside>

    <div class="flex-1 flex flex-col overflow-hidden">
      <header class="bg-white border-b border-slate-200 flex-shrink-0">
        <div class="px-6 py-4 flex items-center justify-between">
          <div>
            <h1 class="text-xl font-semibold text-slate-800">Checklist</h1>
            <p class="text-xs text-slate-500 mt-0.5">
              Demandas dos testes e ajustes da implantação (Nexus + BSS).
            </p>
          </div>
          <div class="flex items-center gap-3 text-sm">
            <span id="usuario-info" class="text-slate-500">—</span>
            <button onclick="logout()" class="text-slate-500 hover:text-slate-800">Sair</button>
          </div>
        </div>
      </header>

      <!-- Filtros -->
      <div class="bg-white border-b border-slate-200 px-6 py-3 flex-shrink-0">
        <div class="flex items-center gap-3 flex-wrap text-sm">
          <input id="f-busca" type="text" placeholder="Buscar assunto ou descrição…"
                 oninput="debounceCarregar()"
                 class="w-64 border border-slate-300 rounded-lg px-3 py-1.5
                        focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
          <select id="f-status" onchange="carregar()"
                  class="border border-slate-300 rounded-lg px-2 py-1.5 bg-white">
            <option value="">Abertas (padrão)</option>
            <option value="aberta">Aberta</option>
            <option value="em_dev">Em desenvolvimento</option>
            <option value="aguardando">Aguardando</option>
            <option value="resolvida">Resolvida</option>
            <option value="cancelada">Cancelada</option>
            <option value="__todas">Todas</option>
          </select>
          <select id="f-prioridade" onchange="carregar()"
                  class="border border-slate-300 rounded-lg px-2 py-1.5 bg-white">
            <option value="">Toda prioridade</option>
            <option value="1">Alta</option>
            <option value="2">Média</option>
            <option value="3">Baixa</option>
          </select>
          <select id="f-tipo" onchange="carregar()"
                  class="border border-slate-300 rounded-lg px-2 py-1.5 bg-white">
            <option value="">Todo tipo</option>
            <option value="ajuste">Ajuste</option>
            <option value="bug">Bug</option>
            <option value="melhoria">Melhoria</option>
          </select>
          <select id="f-responsavel" onchange="carregar()"
                  class="border border-slate-300 rounded-lg px-2 py-1.5 bg-white">
            <option value="">Todo responsável</option>
            <option value="Larissa">Larissa</option>
            <option value="Figueiredo">Figueiredo</option>
          </select>
          <input id="f-modulo" list="lista-modulos" placeholder="Módulo"
                 oninput="debounceCarregar()"
                 class="w-40 border border-slate-300 rounded-lg px-3 py-1.5
                        focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
          <datalist id="lista-modulos"></datalist>

          <button onclick="abrirNova()"
                  class="ml-auto px-4 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium">
            + Nova tarefa
          </button>
        </div>
      </div>

      <!-- Tabela -->
      <div class="flex-1 overflow-y-auto">
        <table class="w-full text-sm">
          <thead class="bg-slate-100 text-slate-500 text-xs uppercase tracking-wider sticky top-0">
            <tr>
              <th class="text-left font-semibold px-4 py-2 w-14">#</th>
              <th class="text-left font-semibold px-4 py-2 w-20">Prior.</th>
              <th class="text-left font-semibold px-4 py-2 w-24">Tipo</th>
              <th class="text-left font-semibold px-4 py-2 w-28">Módulo</th>
              <th class="text-left font-semibold px-4 py-2">Assunto</th>
              <th class="text-left font-semibold px-4 py-2 w-28">Responsável</th>
              <th class="text-left font-semibold px-4 py-2 w-40">Status</th>
              <th class="text-left font-semibold px-4 py-2 w-28">Criada</th>
              <th class="text-left font-semibold px-4 py-2 w-28">Concluída</th>
              <th class="text-left font-semibold px-4 py-2 w-16">Print</th>
            </tr>
          </thead>
          <tbody id="corpo" class="divide-y divide-slate-100 bg-white">
            <tr><td colspan="10" class="px-4 py-6 text-slate-400">Carregando…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal criar/editar -->
  <div id="modal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-xl max-w-xl w-full max-h-[90vh] flex flex-col">
      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between gap-3">
        <h3 id="modal-titulo" class="font-semibold text-slate-800">Nova tarefa</h3>
        <button onclick="fecharModal()" class="text-slate-400 hover:text-slate-700 text-xl leading-none">&times;</button>
      </div>
      <div class="px-5 py-4 overflow-y-auto flex-1 space-y-3">
        <input type="hidden" id="m-id">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Prioridade</label>
            <select id="m-prioridade" class="w-full text-sm border border-slate-300 rounded-lg px-2 py-2 bg-white">
              <option value="1">Alta</option>
              <option value="2" selected>Média</option>
              <option value="3">Baixa</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Status</label>
            <select id="m-status" class="w-full text-sm border border-slate-300 rounded-lg px-2 py-2 bg-white">
              <option value="aberta">Aberta</option>
              <option value="em_dev">Em desenvolvimento</option>
              <option value="aguardando">Aguardando</option>
              <option value="resolvida">Resolvida</option>
              <option value="cancelada">Cancelada</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Tipo</label>
            <select id="m-tipo" class="w-full text-sm border border-slate-300 rounded-lg px-2 py-2 bg-white">
              <option value="">—</option>
              <option value="ajuste">Ajuste</option>
              <option value="bug">Bug</option>
              <option value="melhoria">Melhoria</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Responsável</label>
            <select id="m-responsavel" class="w-full text-sm border border-slate-300 rounded-lg px-2 py-2 bg-white">
              <option value="">—</option>
              <option value="Larissa">Larissa</option>
              <option value="Figueiredo">Figueiredo</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Módulo</label>
          <input id="m-modulo" list="lista-modulos" placeholder="Ex.: Benefícios, Boletos, Portal…"
                 class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2
                        focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Assunto *</label>
          <input id="m-assunto" type="text"
                 class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2
                        focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Descrição</label>
          <textarea id="m-descricao" rows="5"
                    class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2
                           focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"></textarea>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Print (opcional)</label>
          <div id="anexo-atual" class="hidden mb-2 text-xs">
            <a id="anexo-link" href="#" onclick="verAnexo(event)" class="text-indigo-600 hover:underline">Ver print atual</a>
          </div>
          <input id="m-arquivo" type="file" accept="image/*,.pdf"
                 class="w-full text-sm text-slate-600 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg
                        file:border-0 file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200">
        </div>
      </div>
      <div class="px-5 py-4 border-t border-slate-100 flex items-center gap-3">
        <button onclick="salvar()" id="btn-salvar"
                class="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium">
          Salvar
        </button>
        <button onclick="fecharModal()" class="px-4 py-2 text-sm border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50">
          Cancelar
        </button>
        <span id="m-status-msg" class="text-xs"></span>
      </div>
    </div>
  </div>

  <script src="/app/js/api.js"></script>
  <script src="/app/js/sidebar.js"></script>
  <script>renderizarSidebar("tarefas");</script>
  <script src="/app/js/tarefas.js"></script>
</body>
</html>
