<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BSS — Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/app/js/api.js"></script>
  <style>body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center">

  <main class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 m-4">
    <div class="text-center mb-8">
      <img src="/app/img/bss_logo_grande.jpg" alt="Benefício Social Sindical"
           class="mx-auto mb-4 max-w-[200px] w-full h-auto" />
      <p class="text-gray-500 text-sm mt-1">Entre com sua conta para continuar</p>
    </div>

    <form id="form-login" class="space-y-4">
      <div>
        <label for="email" class="block mb-1 text-sm font-medium text-gray-700">E-mail</label>
        <input type="email" id="email" name="email" required autofocus
               placeholder="seu@email.com"
               class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2.5" />
      </div>

      <div>
        <label for="senha" class="block mb-1 text-sm font-medium text-gray-700">Senha</label>
        <div class="relative">
          <input type="password" id="senha" name="senha" required
                 placeholder="••••••"
                 class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2.5 pr-16" />
          <button type="button" onclick="toggleSenha()" id="btn-ver-senha"
                  class="absolute right-2 top-1/2 -translate-y-1/2 text-xs text-gray-500 hover:text-gray-800">Ver</button>
        </div>
      </div>

      <div id="erro" class="hidden text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg px-3 py-2"></div>

      <button type="submit" id="btn-entrar"
              class="w-full text-white bg-indigo-600 hover:bg-indigo-700 focus:ring-4 focus:ring-indigo-300 font-medium rounded-lg text-sm px-5 py-2.5 disabled:opacity-50">
        Entrar
      </button>

      <p class="text-center">
        <button type="button" onclick="mostrarEsqueci()" class="text-sm text-indigo-600 hover:text-indigo-800">
          Esqueci minha senha
        </button>
      </p>
    </form>

    <!-- Formulário "esqueci minha senha" -->
    <form id="form-esqueci" class="space-y-4 hidden">
      <p class="text-sm text-gray-600">
        Informe seu e-mail. Se estiver cadastrado, enviaremos um link para você criar uma nova senha.
      </p>
      <div>
        <label for="email-reset" class="block mb-1 text-sm font-medium text-gray-700">E-mail</label>
        <input type="email" id="email-reset" required placeholder="seu@email.com"
               class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2.5" />
      </div>
      <div id="reset-msg" class="hidden text-sm rounded-lg px-3 py-2"></div>
      <button type="submit" id="btn-reset"
              class="w-full text-white bg-indigo-600 hover:bg-indigo-700 focus:ring-4 focus:ring-indigo-300 font-medium rounded-lg text-sm px-5 py-2.5 disabled:opacity-50">
        Enviar link
      </button>
      <p class="text-center">
        <button type="button" onclick="voltarLogin()" class="text-sm text-gray-500 hover:text-gray-800">
          Voltar ao login
        </button>
      </p>
    </form>

    <p class="text-center text-xs text-gray-400 mt-6">BSS <span id="versao">…</span></p>
  </main>

  <script>
    if (usuarioAtual()) {
      window.location.href = "/app/index.html";
    }

    fetch("/version").then(r => r.json())
      .then(d => { document.getElementById("versao").textContent = "v" + d.version; })
      .catch(() => { document.getElementById("versao").textContent = ""; });

    const form    = document.getElementById("form-login");
    const btn     = document.getElementById("btn-entrar");
    const divErro = document.getElementById("erro");

    function toggleSenha() {
      const campo = document.getElementById("senha");
      const b = document.getElementById("btn-ver-senha");
      const mostrar = campo.type === "password";
      campo.type = mostrar ? "text" : "password";
      b.textContent = mostrar ? "Ocultar" : "Ver";
    }

    function mostrarEsqueci() {
      form.classList.add("hidden");
      document.getElementById("form-esqueci").classList.remove("hidden");
      document.getElementById("email-reset").value = document.getElementById("email").value.trim();
      document.getElementById("email-reset").focus();
    }

    function voltarLogin() {
      document.getElementById("form-esqueci").classList.add("hidden");
      document.getElementById("reset-msg").classList.add("hidden");
      form.classList.remove("hidden");
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      divErro.classList.add("hidden");
      btn.disabled = true;
      btn.textContent = "Entrando...";
      try {
        await apiLogin(
          document.getElementById("email").value.trim(),
          document.getElementById("senha").value
        );
        window.location.href = "/app/index.html";
      } catch (e) {
        divErro.textContent = e.message;
        divErro.classList.remove("hidden");
        btn.disabled = false;
        btn.textContent = "Entrar";
      }
    });

    const formEsqueci = document.getElementById("form-esqueci");
    formEsqueci.addEventListener("submit", async (event) => {
      event.preventDefault();
      const btnR = document.getElementById("btn-reset");
      const msg = document.getElementById("reset-msg");
      msg.classList.add("hidden");
      btnR.disabled = true;
      btnR.textContent = "Enviando...";
      try {
        const r = await fetch("/auth/esqueci-senha", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: document.getElementById("email-reset").value.trim() }),
        });
        const d = await r.json().catch(() => ({}));
        // Resposta neutra de propósito: não confirmamos se o e-mail existe.
        msg.textContent = d.mensagem ||
          "Se o e-mail estiver cadastrado, enviamos um link de redefinição.";
        msg.className = "text-sm rounded-lg px-3 py-2 text-green-700 bg-green-50 border border-green-200";
        msg.classList.remove("hidden");
      } catch (e) {
        msg.textContent = "Não foi possível enviar agora. Tente novamente.";
        msg.className = "text-sm rounded-lg px-3 py-2 text-red-700 bg-red-50 border border-red-200";
        msg.classList.remove("hidden");
      } finally {
        btnR.disabled = false;
        btnR.textContent = "Enviar link";
      }
    });
  </script>
</body>
</html>
