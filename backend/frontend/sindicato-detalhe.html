<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Detalhe do Sindicato — BSS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="w-56 flex-shrink-0"></aside>

    <div class="flex-1 flex flex-col">
      <header class="bg-white border-b border-slate-200">
        <div class="px-6 py-4 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <a href="/app/sindicatos.html" class="text-slate-400 hover:text-slate-700 text-xl">←</a>
            <h1 id="titulo" class="text-xl font-semibold text-slate-800">Detalhe do Sindicato</h1>
          </div>
          <div class="flex items-center gap-3 text-sm">
            <button id="btn-editar-sind" onclick="abrirEdicaoSind()"
                    class="hidden px-3 py-1.5 border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-lg font-medium">
              Editar
            </button>
            <span id="usuario-info" class="text-slate-500">—</span>
            <button onclick="logout()" class="text-slate-500 hover:text-slate-800">Sair</button>
          </div>
        </div>
      </header>

      <main class="flex-1 px-6 py-6 max-w-7xl">
        <div id="loading" class="text-slate-500 text-center py-12">Carregando…</div>

        <!-- Modal de edição do sindicato -->
        <div id="modal-sind" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
          <div class="bg-white rounded-xl shadow-xl max-w-2xl w-full max-h-[90vh] flex flex-col">
            <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between gap-3">
              <h3 class="font-semibold text-slate-800">Editar sindicato</h3>
              <button onclick="fecharEdicaoSind()" class="text-slate-400 hover:text-slate-700 text-xl leading-none">&times;</button>
            </div>
            <div class="px-5 py-4 overflow-y-auto flex-1 grid grid-cols-1 md:grid-cols-12 gap-3 text-sm">
              <div class="md:col-span-8"><label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Razão social *</label>
                <input id="es-razao" class="w-full border border-slate-300 rounded-lg px-3 py-2"></div>
              <div class="md:col-span-4"><label class="block text-xs font-semibold text-slate-500 uppercase mb-1">CNPJ</label>
                <input id="es-cnpj" class="w-full border border-slate-300 rounded-lg px-3 py-2"></div>
              <div class="md:col-span-6"><label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Nome fantasia</label>
                <input id="es-fantasia" class="w-full border border-slate-300 rounded-lg px-3 py-2"></div>
              <div class="md:col-span-4"><label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Categoria</label>
                <input id="es-categoria" class="w-full border border-slate-300 rounded-lg px-3 py-2"></div>
              <div class="md:col-span-2"><label class="block text-xs font-semibold text-slate-500 uppercase mb-1">UF</label>
                <input id="es-uf" maxlength="2" class="w-full border border-slate-300 rounded-lg px-3 py-2 uppercase"></div>
              <div class="md:col-span-8"><label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Federação</label>
                <input id="es-federacao" class="w-full border border-slate-300 rounded-lg px-3 py-2"></div>
              <div class="md:col-span-4"><label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Contrato BSS</label>
                <input id="es-contrato" class="w-full border border-slate-300 rounded-lg px-3 py-2"></div>
              <div class="md:col-span-6"><label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Presidente</label>
                <input id="es-presidente" class="w-full border border-slate-300 rounded-lg px-3 py-2"></div>
              <div class="md:col-span-6"><label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Vice-presidente</label>
                <input id="es-vice" class="w-full border border-slate-300 rounded-lg px-3 py-2"></div>
              <div class="md:col-span-6"><label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Telefone</label>
                <input id="es-telefone" class="w-full border border-slate-300 rounded-lg px-3 py-2"></div>
              <div class="md:col-span-6"><label class="block text-xs font-semibold text-slate-500 uppercase mb-1">E-mail</label>
                <input id="es-email" class="w-full border border-slate-300 rounded-lg px-3 py-2"></div>
              <div class="md:col-span-6 flex items-center gap-4 pt-1">
                <label class="inline-flex items-center text-slate-700"><input type="checkbox" id="es-atendimento" class="mr-2">Em atendimento</label>
                <label class="inline-flex items-center text-slate-700"><input type="checkbox" id="es-ativo" class="mr-2">Ativo</label>
              </div>
              <p class="md:col-span-12 text-xs text-slate-400">Campos enviados pela sync podem ser sobrescritos no próximo ciclo.</p>
            </div>
            <div class="px-5 py-4 border-t border-slate-100 flex items-center gap-3">
              <button onclick="salvarEdicaoSind()" id="btn-salvar-sind" class="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium">Salvar</button>
              <button onclick="fecharEdicaoSind()" class="px-4 py-2 text-sm border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50">Cancelar</button>
              <span id="es-msg" class="text-xs"></span>
            </div>
          </div>
        </div>

        <div id="conteudo" class="hidden space-y-4">
          <!-- Tabs -->
          <div class="flex items-center gap-2 border-b border-slate-200">
            <button onclick="trocarAba('basica')"  id="tab-basica"
                    class="px-4 py-2 text-sm font-medium text-slate-800 border-b-2 border-indigo-600">
              Informação Básica do Sindicato
            </button>
            <button onclick="trocarAba('entrega')" id="tab-entrega"
                    class="px-4 py-2 text-sm text-slate-500 hover:text-slate-800">
              Informações para Entrega
            </button>
          </div>

          <!-- Aba: Informação Básica -->
          <section id="aba-basica" class="bg-white rounded-lg border border-slate-200 p-5">
            <div id="grid-basica" class="grid grid-cols-1 md:grid-cols-12 gap-y-3 gap-x-6 text-sm"></div>
          </section>

          <!-- Aba: Informações para Entrega -->
          <section id="aba-entrega" class="bg-white rounded-lg border border-slate-200 p-5 hidden">
            <div id="grid-entrega" class="grid grid-cols-1 md:grid-cols-12 gap-y-3 gap-x-6 text-sm"></div>
          </section>

          <!-- LOG -->
          <section class="bg-white rounded-lg border border-slate-200">
            <div class="px-5 py-3 bg-slate-50 border-b border-slate-200">
              <h2 class="text-sm font-semibold text-slate-700">LOG</h2>
            </div>
            <div id="grid-log" class="p-5 grid grid-cols-1 md:grid-cols-12 gap-y-3 gap-x-6 text-sm"></div>
          </section>
        </div>

        <div id="erro" class="hidden text-rose-600 text-center py-8"></div>
      </main>
    </div>
  </div>

  <script src="/app/js/api.js"></script>
  <script src="/app/js/sidebar.js"></script>
  <script>renderizarSidebar("sindicatos");</script>
  <script src="/app/js/sindicato-detalhe.js"></script>
</body>
</html>
