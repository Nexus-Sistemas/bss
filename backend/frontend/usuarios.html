<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Usuários — BSS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">
  <div class="flex h-screen overflow-hidden">
    <aside id="sidebar" class="w-60 flex-shrink-0"></aside>

    <div class="flex-1 flex flex-col overflow-hidden">
      <header class="bg-white border-b border-slate-200 flex-shrink-0">
        <div class="px-6 py-4 flex items-center justify-between">
          <div>
            <h1 class="text-xl font-semibold text-slate-800">Usuários</h1>
            <p class="text-xs text-slate-500 mt-0.5">Equipe interna da BSS.</p>
          </div>
          <div class="flex items-center gap-3 text-sm">
            <span id="usuario-info" class="text-slate-500">—</span>
            <button onclick="logout()" class="text-slate-500 hover:text-slate-800">Sair</button>
          </div>
        </div>
      </header>

      <div class="bg-white border-b border-slate-200 px-6 py-3 flex-shrink-0">
        <div class="flex items-center gap-3 flex-wrap text-sm">
          <input id="f-busca" type="text" placeholder="Buscar nome, e-mail, depto…"
                 oninput="debounceCarregar()"
                 class="w-72 border border-slate-300 rounded-lg px-3 py-1.5
                        focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
          <button onclick="abrirNovo()"
                  class="ml-auto px-4 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium">
            + Novo usuário
          </button>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto">
        <table class="w-full text-sm">
          <thead class="bg-slate-100 text-slate-500 text-xs uppercase tracking-wider sticky top-0">
            <tr>
              <th class="text-left font-semibold px-4 py-2">Nome</th>
              <th class="text-left font-semibold px-4 py-2 w-40">Departamento</th>
              <th class="text-left font-semibold px-4 py-2 w-40">Cargo</th>
              <th class="text-left font-semibold px-4 py-2 w-60">E-mail</th>
              <th class="text-left font-semibold px-4 py-2 w-24">Ativo</th>
              <th class="text-left font-semibold px-4 py-2 w-36">Último acesso</th>
            </tr>
          </thead>
          <tbody id="corpo" class="divide-y divide-slate-100 bg-white">
            <tr><td colspan="6" class="px-4 py-6 text-slate-400">Carregando…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal criar/editar -->
  <div id="modal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-xl max-w-lg w-full max-h-[90vh] flex flex-col">
      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between gap-3">
        <h3 id="modal-titulo" class="font-semibold text-slate-800">Novo usuário</h3>
        <button onclick="fecharModal()" class="text-slate-400 hover:text-slate-700 text-xl leading-none">&times;</button>
      </div>
      <div class="px-5 py-4 overflow-y-auto flex-1 space-y-3">
        <input type="hidden" id="m-id">
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Nome *</label>
          <input id="m-nome" type="text"
                 class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2
                        focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Departamento</label>
            <input id="m-departamento" type="text"
                   class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2
                          focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Cargo</label>
            <input id="m-cargo" type="text"
                   class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2
                          focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">E-mail *</label>
          <input id="m-email" type="email"
                 class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2
                        focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
        </div>
        <!-- Senha só na CRIAÇÃO. Na edição, a pessoa troca pelo "esqueci minha senha". -->
        <div id="wrap-senha">
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Senha inicial *</label>
          <div class="relative">
            <input id="m-senha" type="password"
                   class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 pr-16
                          focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            <button type="button" onclick="toggleSenha()" id="btn-ver-senha"
                    class="absolute right-2 top-1/2 -translate-y-1/2 text-xs text-slate-500 hover:text-slate-800">Ver</button>
          </div>
          <p class="text-xs text-slate-400 mt-1">Mínimo 6 caracteres. A pessoa pode trocar depois pelo "Esqueci minha senha".</p>
        </div>
        <label class="inline-flex items-center text-sm text-slate-700">
          <input type="checkbox" id="m-ativo" class="mr-2" checked>
          Ativo (pode fazer login)
        </label>
      </div>
      <div class="px-5 py-4 border-t border-slate-100 flex items-center gap-3">
        <button onclick="salvar()" id="btn-salvar"
                class="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium">
          Salvar
        </button>
        <button onclick="fecharModal()" class="px-4 py-2 text-sm border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50">
          Cancelar
        </button>
        <span id="m-status-msg" class="text-xs"></span>
      </div>
    </div>
  </div>

  <script src="/app/js/api.js"></script>
  <script src="/app/js/sidebar.js"></script>
  <script>renderizarSidebar("usuarios");</script>
  <script src="/app/js/usuarios.js"></script>
</body>
</html>
